<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카드 부정사용 현장 판단</title>
<meta name="description" content="타인 카드·계좌·간편결제 부정사용 112 신고 현장에서 적용 법률과 조치를 확인하는 참고 도구">
<meta name="theme-color" content="#1f4fd1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>카드 부정사용 현장 판단</h1>
    <button id="theme" class="icon-btn" aria-label="화면 밝기 전환">◐</button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-mode="use" aria-selected="true">카드·계좌 무단사용</button>
    <button role="tab" data-mode="mule">대포통장·카드</button>
    <button role="tab" data-mode="money">잘못 들어온 돈</button>
    <button role="tab" data-mode="ref">법령·판례</button>
  </nav>
</header>

<main id="app">
  <p class="disclaimer">현장 참고용입니다. 최종 죄명·적용법조는 수사팀과 검사 지휘에 따릅니다. 입력한 내용은 이 기기 밖으로 전송·저장되지 않습니다.</p>

  <!-- 카드·계좌 무단사용 -->
  <section id="mode-use" class="mode">
    <div class="step"><h2><span class="n">1</span>무엇을 썼나</h2><div class="chips" id="medium"></div></div>
    <div class="step"><h2><span class="n">2</span>어떻게 손에 넣었나</h2><div class="chips" id="acq"></div>
      <div id="entrust-box" class="sub" hidden>
        <div class="sub-q">인출 · 결제를 부탁받았나요?</div>
        <div class="chips" id="entrust"></div>
      </div>
    </div>
    <div class="step"><h2><span class="n">3</span>어떻게 썼나 <small>여러 개 추가 가능</small></h2>
      <div id="uses"></div>
      <button class="add" id="add-use">+ 사용 행위 추가</button>
    </div>
    <div class="step"><h2><span class="n">4</span>결과를 바꾸는 사실</h2>
      <div class="sub-q">명의자(피해자)와 피의자의 관계</div><div class="chips" id="relation"></div>
      <div class="sub-q">범행 시기</div><div class="chips" id="date"></div>
      <div class="sub-q">피해 총액 (선택, 5억원 이상이면 특경법 안내)</div>
      <input id="amount" class="text" inputmode="numeric" placeholder="예: 350000">
    </div>
  </section>

  <!-- 대포통장·카드 -->
  <section id="mode-mule" class="mode" hidden>
    <div class="step"><h2><span class="n">1</span>무엇을</h2><div class="chips" id="item"></div></div>
    <div class="step"><h2><span class="n">2</span>누가</h2><div class="chips" id="role"></div></div>
    <div class="step" id="how-step"><h2><span class="n">3</span>어떻게</h2><div class="chips" id="how"></div></div>
    <div class="step"><h2><span class="n">4</span>추가 사실</h2>
      <label class="check"><input type="checkbox" id="usedForFraud"> 넘긴 통장·카드가 보이스피싱 등 범죄에 실제로 쓰였다</label>
    </div>
  </section>

  <!-- 잘못 들어온 돈 -->
  <section id="mode-money" class="mode" hidden>
    <div class="step"><h2><span class="n">1</span>어떤 상황인가</h2><div class="chips" id="moneyCase"></div></div>
    <div class="step"><h2><span class="n">2</span>추가 사실</h2>
      <div class="sub-q">송금인(피해자)과의 관계</div><div class="chips" id="relation2"></div>
      <div class="sub-q">범행 시기</div><div class="chips" id="date2"></div>
      <div class="sub-q">금액 (선택)</div>
      <input id="amount2" class="text" inputmode="numeric" placeholder="예: 1500000">
    </div>
  </section>

  <!-- 결과 -->
  <section id="result" aria-live="polite"></section>

  <!-- 법령·판례 -->
  <section id="mode-ref" class="mode" hidden></section>
</main>

<footer class="foot">
  <span id="verified"></span> ·
  <a href="https://github.com/bandit1397/Fraudulent-Card-Use" rel="noopener">GitHub</a>
</footer>

<script src="data/laws.js"></script>
<script src="data/precedents.js"></script>
<script src="data/guides.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
